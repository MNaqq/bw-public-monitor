name: Public status monitor

on:
  schedule:
    - cron: '7,37 * * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: public-status-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      monitor_outcome: ${{ steps.monitor.outcome }}
      capture_outcome: ${{ steps.capture.outcome }}
    env:
      BW_MONITOR_OUTPUT_DIR: ${{ runner.temp }}/bw-public-monitor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 22
      - name: Install pinned dependencies
        id: install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run boundary tests
        run: npm test
      - name: Verify public export boundary
        run: npm run check
      - name: Check public pages and links
        id: monitor
        run: npm run run
      - name: Capture anonymous screenshots
        id: capture
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *') && steps.setup-node.outcome == 'success' && steps.install.outcome == 'success' }}
        run: |
          npx playwright install --with-deps chromium
          npm run capture
      - name: Upload short-lived screenshots
        if: ${{ always() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: public-status-${{ github.run_id }}
          path: ${{ runner.temp }}/bw-public-monitor/screenshots
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload status-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-status-data-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bw-public-monitor/report.json
            ${{ runner.temp }}/bw-public-monitor/capture.json
          if-no-files-found: ignore
          retention-days: 1

  report:
    if: always()
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    env:
      BW_MONITOR_OUTPUT_DIR: ${{ runner.temp }}/bw-public-monitor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download status-only report
        if: ${{ needs.monitor.outputs.monitor_outcome != 'skipped' || needs.monitor.outputs.capture_outcome == 'success' || needs.monitor.outputs.capture_outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: public-status-data-${{ github.run_id }}
          path: ${{ runner.temp }}/bw-public-monitor
      - name: Open or close the status issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_OUTCOME: ${{ needs.monitor.outputs.monitor_outcome }}
          CAPTURE_OUTCOME: ${{ needs.monitor.outputs.capture_outcome }}
        run: node report-status.mjs
