name: Public monitor gates

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run public boundary tests
        run: npm test
      - name: Verify reviewed export allowlist
        run: npm run check
